<html lang="en">

<meta charset="UTF-8">

<style>
  :root{
    --ink:#1e293b; --ink-soft:#64748b;
    --teal:#7a1230; --teal-dark:#4a0a1c; --teal-light:#fbe9ee;
    --amber:#b8860b; --amber-light:#fbf1d6;
    --green:#22c55e; --green-light:#dcfce7;
    --red:#ef4444; --red-light:#fee2e2;
    --blue:#3b82f6; --blue-light:#dbeafe;
    --gray:#cbd5e1; --gray-light:#f1f5f9;
    --border:#e2e8f0;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#ffffff;color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Poppins',sans-serif;}
  .wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px;}

  .hero{display:flex;align-items:center;gap:14px;padding:22px 4px 18px;border-bottom:1px solid var(--border);margin-bottom:18px;}
  .hero-badge{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));border:2px solid var(--amber);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;box-shadow:var(--shadow);}
  .hero h1{font-size:20px;margin:0;font-weight:700;line-height:1.25;}
  .hero p{margin:2px 0 0;color:var(--ink-soft);font-size:13px;font-weight:500;}
  .hero-right{margin-left:auto;}

  .pill-btn{border:1px solid var(--border);background:#fff;color:var(--ink);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:.15s;}
  .pill-btn:hover{border-color:var(--teal);color:var(--teal-dark);}
  .pill-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;}

  .tabs{display:flex;gap:8px;margin-bottom:22px;overflow-x:auto;padding-bottom:2px;}
  .tab{padding:9px 16px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink-soft);white-space:nowrap;transition:.15s;}
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  .card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.grid2{grid-template-columns:1fr;}}

  .stat-box{background:var(--gray-light);border-radius:14px;padding:16px;text-align:center;}
  .stat-num{font-family:'Poppins',sans-serif;font-size:26px;font-weight:800;color:var(--teal-dark);}
  .stat-lbl{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:2px;}

  .ring-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .ring{width:118px;height:118px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;}
  .ring-inner{width:92px;height:92px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-pct{font-family:'Poppins',sans-serif;font-weight:800;font-size:22px;}
  .ring-pct-lbl{font-size:10px;color:var(--ink-soft);font-weight:600;}

  .bar-track{background:var(--gray-light);border-radius:999px;height:10px;overflow:hidden;margin-top:8px;}
  .bar-fill{height:100%;border-radius:999px;transition:width .4s;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;}
  .badge.green{background:var(--green-light);color:#15803d;}
  .badge.red{background:var(--red-light);color:#b91c1c;}
  .badge.amber{background:var(--amber-light);color:#b45309;}

  .search-box{position:relative;}
  .search-box input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:14px;font-size:15px;font-family:'Inter',sans-serif;outline:none;transition:.15s;}
  .search-box input:focus{border-color:var(--teal);}
  .suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);max-height:260px;overflow-y:auto;z-index:20;}
  .suggest-item{padding:11px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--gray-light);}
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item:hover{background:var(--teal-light);}
  .suggest-item b{color:var(--teal-dark);}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-head button{border:none;background:var(--gray-light);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-size:10.5px;font-weight:700;color:var(--ink-soft);text-align:center;padding-bottom:4px;}
  .cal-day{aspect-ratio:1;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;position:relative;gap:1px;}
  .cal-day.empty{visibility:hidden;}
  .cal-day.present{background:var(--green);color:#fff;}
  .cal-day.absent{background:var(--red);color:#fff;}
  .cal-day.partial{background:var(--blue);color:#fff;}
  .cal-day.none{background:var(--gray-light);color:var(--ink-soft);font-weight:600;}
  .cal-day.cancelled{background:#1e293b;color:#fff;}
  .cal-day.today{box-shadow:0 0 0 2px var(--ink);}
  .cal-day .tick{font-size:8px;letter-spacing:-1px;line-height:1;opacity:.9;}
  .cal-day .cxdot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#000;border:1px solid #fff;}
  .cal-day.has-sched{cursor:pointer;}
  .cal-day.has-sched:hover{outline:2px solid var(--amber);}

  #printArea{display:none;}
  .rpt{font-family:'Inter',sans-serif;color:var(--ink);width:480px;padding:24px;background:#fff;position:relative;}
  .rpt.wide{display:inline-block;width:auto;}
  table.matrix{border-collapse:collapse;font-size:10.5px;white-space:nowrap;margin-top:4px;}
  table.matrix th, table.matrix td{padding:5px 7px;text-align:center;border:1px solid var(--border);}
  table.matrix thead th{background:var(--gray-light);font-weight:700;font-size:9.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  table.matrix thead th.sub{font-size:9px;padding:3px 6px;}
  table.matrix td.mx-name{text-align:left;font-weight:700;background:#fff;}
  table.matrix th.mx-name-h{text-align:left;}
  table.matrix td.mx-pct{font-weight:800;font-family:'Poppins',sans-serif;}
  table.matrix td.mx-p{color:#15803d;font-weight:800;background:#f0fdf4;}
  table.matrix td.mx-a{color:#b91c1c;font-weight:800;background:#fef2f2;}
  table.matrix td.mx-c{color:#94a3b8;font-weight:700;background:#f8fafc;}
  .date-box{position:absolute;top:20px;right:20px;background:var(--teal-dark);color:#fff;border-radius:12px;padding:7px 12px;text-align:center;}
  .date-box .dow{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75;}
  .date-box .dnum{font-family:'Poppins',sans-serif;font-size:18px;font-weight:800;line-height:1.05;}
  .date-box .mon{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9;}
  .rpt .rpt-dept{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--amber);text-transform:uppercase;margin-bottom:3px;}
  .rpt h2{font-family:'Poppins',sans-serif;font-size:17px;margin:0 0 2px;color:var(--teal-dark);}
  .rpt .rpt-sub{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .rpt .rpt-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border);}
  .rpt .rpt-section-title{font-weight:700;font-size:13px;margin:14px 0 6px;color:var(--teal-dark);}
  .rpt .rpt-count{font-family:'Poppins',sans-serif;font-weight:800;font-size:22px;color:var(--teal-dark);}
  .rpt .rpt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .rpt .rpt-box{background:var(--gray-light);border-radius:10px;padding:10px;text-align:center;}
  .rpt .rpt-rolls{font-size:12px;line-height:1.7;word-break:break-word;}
  .rpt .rpt-foot{margin-top:20px;font-size:10.5px;color:var(--ink-soft);border-top:1px solid var(--border);padding-top:10px;}
  .rpt .rpt-two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px;}
  .rpt .rpt-col{background:var(--gray-light);border-radius:12px;padding:12px;}
  .rpt .rpt-col-count{font-family:'Poppins',sans-serif;font-weight:800;font-size:17px;line-height:1;}
  .rpt .rpt-col-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:3px 0 9px;}
  .rpt .rpt-col-rolls{font-size:12px;line-height:1.75;font-weight:600;word-break:break-word;}
  .rpt .rpt-cancelled-note{font-size:12px;color:var(--ink-soft);margin:0 0 14px;}

  .sched-card{background:linear-gradient(135deg,var(--teal-light),#fff);border:1px solid var(--amber);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px;}
  .sched-card.cpc{background:linear-gradient(135deg,#ede9fe,#fff);border-color:#8b5cf6;}
  .sched-card.test{background:linear-gradient(135deg,#e0f2fe,#fff);border-color:#0ea5e9;}
  .sched-card .sched-date{font-size:11.5px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
  .sched-card h4{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--teal-dark);}
  .sched-row{font-size:12.5px;color:var(--ink);margin:5px 0;padding:8px 10px;background:#fff;border-radius:999px;border:1px solid var(--border);}
  .sched-row b{color:var(--ink-soft);font-weight:700;display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;}
  .sched-break{font-size:11px;color:var(--ink-soft);font-weight:600;text-align:center;margin:6px 0;padding:5px 0;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);}
  .sched-presenter{margin-top:10px;padding:9px 12px;background:#fff;border:1px solid var(--border);border-radius:10px;font-size:13px;}
  .sched-presenter + .sched-presenter{margin-top:6px;}
  .sched-presenter b{color:var(--teal-dark);}
  .sched-none{color:var(--ink-soft);font-size:13px;}
  .sched-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;}
  .sched-tag.cpc{background:#ede9fe;color:#6d28d9;}
  .sched-tag.test{background:#e0f2fe;color:#0369a1;}
  .hero-today{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:1px;}
  .hero-today b{color:var(--teal-dark);}
  .hero-today .tag-cpc{color:#6d28d9;font-weight:700;}
  .hero-today .tag-test{color:#0369a1;font-weight:700;}
  .cal-day.sc-case{background:var(--amber-light);color:#8a5a00;font-weight:800;}
  .cal-day.sc-cpc{background:#ede9fe;color:#6d28d9;font-weight:800;}
  .cal-day.sc-test{background:#e0f2fe;color:#0369a1;font-weight:800;}
  .cal-day.sc-topic{background:var(--teal-light);color:var(--teal-dark);}
  .cal-day .roll-tick{font-size:7.5px;letter-spacing:0;line-height:1;font-weight:800;margin-top:2px;padding:1px 4px;border-radius:6px;background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.18);color:inherit;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block !important;position:absolute;top:0;left:0;width:100%;}
    .rpt{width:100%;}
  }
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink-soft);font-weight:600;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}

  textarea, input[type=text], input[type=password], input[type=date], select{font-family:'Inter',sans-serif;}
  .field label{font-size:12.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .field input, .field textarea, .field select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;}
  .field input:focus, .field textarea:focus{border-color:var(--teal);}
  .btn{background:var(--teal);color:#fff;border:none;padding:11px 20px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn:hover{background:var(--teal-dark);}
  .btn.ghost{background:#fff;border:1.5px solid var(--border);color:var(--ink);}
  .btn.danger{background:#fff;border:1.5px solid var(--red);color:var(--red);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}
  .btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px;}

  .session-toggle{display:flex;gap:8px;margin-bottom:10px;}
  .session-toggle button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-weight:700;font-size:13px;cursor:pointer;}
  .session-toggle button.on{background:var(--teal);border-color:var(--teal);color:#fff;}
  .session-toggle button.cancel-on{background:var(--red);border-color:var(--red);color:#fff;}

  .student-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1.5px solid var(--border);font-size:12.5px;font-weight:600;cursor:pointer;margin:3px;}
  .student-chip.absent{background:var(--red-light);border-color:var(--red);color:#b91c1c;}
  .chip-list{display:flex;flex-wrap:wrap;margin:-3px;max-height:260px;overflow-y:auto;padding:2px;}

  .log-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--gray-light);font-size:13px;gap:10px;}
  .log-row:last-child{border-bottom:none;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty-state .em{font-size:34px;margin-bottom:8px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .muted{color:var(--ink-soft);font-size:12.5px;}
  .hidden{display:none !important;}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:150;padding:20px;}
  .modal-box{background:#fff;border-radius:18px;padding:22px;max-width:360px;width:100%;box-shadow:var(--shadow);text-align:center;}
  .modal-box .em{font-size:34px;margin-bottom:8px;}
  .modal-box h3{margin:0 0 6px;font-size:16px;}
  .modal-box p{margin:0 0 16px;color:var(--ink-soft);font-size:13px;}
  .modal-box input{width:100%;text-align:center;letter-spacing:3px;font-size:18px;padding:12px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:14px;font-family:'Inter',sans-serif;outline:none;}
  .modal-box input:focus{border-color:var(--teal);}
  .file-input-label{display:inline-block;background:#fff;border:1.5px solid var(--border);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;}
  .file-input-label input{display:none;}
</style>
</head>

    <div>

</div>

<div id="modalRoot"></div>
<div id="printArea"></div>

async function dbFetch(path){
  try{
    const snapshot = await get(ref(db, path));
    return snapshot.exists() ? snapshot.val() : null;
  }catch(e){ console.error(e); return null; }
}
async function dbPut(path, data){
  try{
    await set(ref(db, path), data);
  }catch(e){ console.error(e); }
}
async function loadAll(){
  const dbRoster = await dbFetch('roster');
  if(!dbRoster){
    students = SEED_STUDENTS;
    await saveStudents();
  } else {
    students = Array.isArray(dbRoster) ? dbRoster : Object.values(dbRoster);
    let migrated = false;
    students = students.map(s=>{
      if(!s.pin){ migrated = true; return {...s, pin: genPin()}; }
      return s;
    });
    if(migrated) await saveStudents();
  }

  const dbLog = await dbFetch('attendance-log');
  if(!dbLog){
    log = SEED_LOG;
    await saveLog();
  } else {
    log = dbLog;
  }

  const dbPresenter = await dbFetch('case-presenter');
  casePresenter = dbPresenter || null;

  const dbSchedule = await dbFetch('schedule');
  if(!dbSchedule){
    schedule = SEED_SCHEDULE;
    await saveSchedule();
  } else {
    schedule = Array.isArray(dbSchedule) ? dbSchedule : Object.values(dbSchedule);
  }
}

function scheduleFor(dstr){ return schedule.find(x=>x.date===dstr) || null; }

function extractPresenters(sc){
  if(!sc) return [];
  const rolls = [];
  [sc.am, sc.pm].forEach(txt=>{
    if(!txt) return;
    const m = txt.match(/Case Presentation\s*(\d+)/i);
    if(m) rolls.push(m[1]);
  });
  if(sc.presenter){
    sc.presenter.split(/[\/,;]+/).map(x=>x.trim()).filter(Boolean).forEach(r=>{ if(!rolls.includes(r)) rolls.push(r); });
  }
  return rolls;
}
function isCPCDay(sc){ return !!sc && [sc.am, sc.pm].some(t=> (t||'').trim().toUpperCase()==='CPC'); }
function isTestDay(sc){ return !!sc && [sc.am, sc.pm].some(t=> /ward test/i.test(t||'')); }
function totalScheduledLectures(){
  let count = 0;
  schedule.forEach(sc=>{
    if(isCPCDay(sc)) return;
    if(sc.am && sc.am.trim()) count++;
    if(sc.pm && sc.pm.trim()) count++;
  });
  return count;
}
function sessionTitle(sc){
  const clean = t => t && !/^Case Presentation/i.test(t) ? t : null;
  return clean(sc.pm) || clean(sc.am) || sc.am || sc.pm || 'Session';
}

function studentDayInfo(entry, roll){
  if(!entry) return {status:'none', held:0, attended:0, cancelled:0};
  let held=0, attended=0, cancelled=0;
  ['morning','evening'].forEach(s=>{
    if(entry[s]?.status==='held'){
      held++;
      const absentees = entry[s].absentees || [];
      if(!absentees.includes(roll)) attended++;
    } else if(entry[s]?.status==='cancelled'){
      cancelled++;
    }
  });
  let status = 'none';
  if(held===0 && cancelled>0) status = 'cancelled';
  else if(held>0){
    if(attended===held) status = 'present';
    else if(attended===0) status = 'absent';
    else status = 'partial';
  }
  return {status, held, attended, cancelled};
}
function studentDayStatus(entry, roll){ return studentDayInfo(entry, roll).status; }
function studentProjection(roll){
  const T = totalScheduledLectures();
  const { held, attended } = studentStats(roll);
  const remaining = Math.max(0, T - held);
  const neededTotalAttended = Math.ceil(0.75 * T);
  const mustAttendMore = Math.max(0, neededTotalAttended - attended);
  const reachable = mustAttendMore <= remaining;
  const canMiss = reachable ? remaining - mustAttendMore : 0;
  return { T, remaining, neededTotalAttended, mustAttendMore, canMiss, reachable };
}
function studentStats(roll){
  let held=0, attended=0;
  Object.values(log).forEach(entry=>{
    ['morning','evening'].forEach(s=>{
      if(entry[s]?.status==='held'){
        held++;
        const absentees = entry[s].absentees || [];
        if(!absentees.includes(roll)) attended++;
      }
    });
  });
  const pct = held===0 ? 100 : Math.round((attended/held)*1000)/10;
  let needed = 0;
  if(held>0 && pct < TARGET){
    needed = Math.ceil((0.75*held - attended)/0.25);
    if(needed<0) needed=0;
  }
  return {held, attended, pct, needed};
}
function batchStats(){
  let heldSessions=0, cancelledSessions=0;
  Object.values(log).forEach(entry=>{
    ['morning','evening'].forEach(s=>{
      if(entry[s]?.status==='held') heldSessions++;
      else if(entry[s]?.status==='cancelled') cancelledSessions++;
    });
  });
  let sum=0, count=0;
  students.forEach(st=>{
    const s = studentStats(st.roll);
    if(s.held>0){ sum += s.pct; count++; }
  });
  const avgPct = count>0 ? Math.round((sum/count)*10)/10 : 0;
  return {heldSessions, cancelledSessions, avgPct, totalDays: Object.keys(log).length};
}
function pctColor(pct){
  if(pct>=TARGET) return 'var(--green)';
  if(pct>=TARGET-10) return 'var(--amber)';
  return 'var(--red)';
}
function fmtDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return fmtDate(new Date()); }
function fmtNice(dstr){
  const d = new Date(dstr+'T00:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'});
}
function tableColor(pct){ return pct>=TARGET ? {bg:'var(--green-light)', fg:'#15803d'} : {bg:'var(--red-light)', fg:'#b91c1c'}; }
function allStudentsSummaryLine(){
  if(students.length===0) return 'No students in roster yet.';
  let below=0, above=0;
  students.forEach(s=>{ const st=studentStats(s.roll); if(st.held===0) return; st.pct>=TARGET ? above++ : below++; });
  return `${above} at or above ${TARGET}% · ${below} below ${TARGET}%${students.length-above-below>0 ? ` · ${students.length-above-below} with no sessions yet` : ''}`;
}
function renderAllStudentsTable(filterText){
  const el = document.getElementById('allStudentsTable');
  if(!el) return;
  const q = (filterText||'').trim().toLowerCase();
  let rows = students.map(s=>({s, st: studentStats(s.roll)}));
  if(q) rows = rows.filter(r=> r.s.roll.toLowerCase().includes(q) || r.s.name.toLowerCase().includes(q));
  if(tableSort==='low') rows.sort((a,b)=> a.st.pct - b.st.pct);
  else rows.sort((a,b)=> a.s.roll.localeCompare(b.s.roll, undefined, {numeric:true}));
  if(rows.length===0){ el.innerHTML = `<p class="muted">No matching students.</p>`; return; }
  el.innerHTML = rows.map(({s, st})=>{
    const c = tableColor(st.pct);
    const p = studentProjection(s.roll);
    let projLine = '';
    if(!p.reachable) projLine = ` · 75% not reachable`;
    else if(p.mustAttendMore>0) projLine = ` · needs ${p.mustAttendMore}/${p.remaining} left (can miss ${p.canMiss})`;
    else projLine = ` · can miss ${p.canMiss}/${p.remaining} left`;
    return `<div class="log-row">
      <span><b>${s.roll}</b> — ${s.name}<br><span class="muted">${st.attended}/${st.held} sessions${projLine}</span></span>
      <span class="badge" style="background:${c.bg};color:${c.fg};font-size:13px;">${st.held===0 ? '—' : st.pct+'%'}</span>
    </div>`;
  }).join('');
}

function nextUpcomingSchedule(fromDateStr){
  const sorted = [...schedule].sort((a,b)=>a.date.localeCompare(b.date));
  return sorted.find(sc => sc.date >= fromDateStr) || null;
}
function renderHeroToday(){
  const el = document.getElementById('heroToday');
  if(!el) return;
  const todaySc = scheduleFor(todayStr());
  let dayOver = false;
  if(todaySc){
    const endHour = todaySc.pm ? 14 : 12;
    const endMin = todaySc.pm ? 0 : 30;
    const end = new Date();
    end.setHours(endHour, endMin, 0, 0);
    dayOver = new Date() > end;
  }
  let label, sc;
  if(todaySc && !dayOver){
    label = 'Today'; sc = todaySc;
  } else {
    sc = nextUpcomingSchedule(tomorrowStr());
    label = sc ? (sc.date===tomorrowStr() ? 'Tomorrow' : fmtNice(sc.date)) : null;
  }
  if(!sc){ el.innerHTML = 'No upcoming class scheduled'; return; }
  const rolls = extractPresenters(sc);
  const cpc = isCPCDay(sc), test = isTestDay(sc);
  let tag = '';
  if(cpc) tag = ' · <span class="tag-cpc">CPC</span>';
  else if(test) tag = ' · <span class="tag-test">Ward Test</span>';
  else if(rolls.length) tag = ` · 🎤 ${rolls.join(', ')}`;
  el.innerHTML = `${label}: <b>${sessionTitle(sc)}</b>${tag}`;
}

function renderSchedCalendar(){
  const year = schedCalCursor.getFullYear(), month = schedCalCursor.getMonth();
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-GB',{month:'long', year:'numeric'});
  const dows = ['S','M','T','W','T','F','S'];
  let head = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dstr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const sc = scheduleFor(dstr);
    const isToday = dstr===todayStr();
    const hasSched = !!sc;
    let typeClass = '', marker = '';
    if(sc){
      const rolls = extractPresenters(sc);
      if(isCPCDay(sc)){ typeClass = 'sc-cpc'; marker = '<span class="roll-tick">CPC</span>'; }
      else if(isTestDay(sc)){ typeClass = 'sc-test'; marker = '<span class="roll-tick">TEST</span>'; }
      else if(rolls.length){ typeClass = 'sc-case'; marker = `<span class="roll-tick">👤${rolls.join(',')}</span>`; }
      else { typeClass = 'sc-topic'; marker = ''; }
    }
    cells += `<div class="cal-day none${typeClass?' '+typeClass:''}${hasSched?' has-sched':''}${isToday?' today':''}" data-date="${dstr}">${d}${marker}</div>`;
  }
  return `
    <div class="cal-head">
      <button id="schedCalPrev">‹</button>
      <b>${monthLabel}</b>
      <button id="schedCalNext">›</button>
    </div>
    <div class="cal-grid">${head}${cells}</div>
    <div class="legend">
      <span><span class="dot" style="background:var(--amber-light);border:1px solid var(--amber);"></span>Case presentation (roll no. shown)</span>
      <span><span class="dot" style="background:#ede9fe;border:1px solid #8b5cf6;"></span>CPC</span>
      <span><span class="dot" style="background:#e0f2fe;border:1px solid #0ea5e9;"></span>Ward test</span>
      <span><span class="dot" style="background:var(--teal-light);border:1px solid var(--amber);"></span>Other class (tap for details)</span>
    </div>
  `;
}

    <div id="studentResult"></div>
  `;
  const input = document.getElementById('searchInput');
  const box = document.getElementById('suggestBox');
  input.oninput = ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ box.classList.add('hidden'); return; }
    const matches = students.filter(s=> s.roll.toLowerCase().includes(q) || s.name.toLowerCase().includes(q)).slice(0,8);
    if(matches.length===0){ box.innerHTML = `<div class="suggest-item muted">No matching student</div>`; box.classList.remove('hidden'); return; }
    box.innerHTML = matches.map(s=>`<div class="suggest-item" data-roll="${s.roll}"><b>${s.roll}</b> — ${s.name}</div>`).join('');
    box.classList.remove('hidden');
    box.querySelectorAll('.suggest-item').forEach(item=>{
      item.onclick = ()=>{
        const roll = item.dataset.roll;
        if(!roll) return;
        const student = students.find(s=>s.roll===roll);
        input.value = `${student.roll} — ${student.name}`;
        box.classList.add('hidden');
        if(isEditor || unlockedRoll===roll){
          selectedStudent = student;
          calCursor = new Date();
          renderStudentResult();
        } else {
          modalStudentPin(student, ()=>{
            selectedStudent = student;
            unlockedRoll = roll;
            calCursor = new Date();
            renderStudentResult();
          });
        }
      };
    });
  };
  if(selectedStudent && (isEditor || unlockedRoll===selectedStudent.roll)) renderStudentResult();
}

function renderCalendar(roll){
  const year = calCursor.getFullYear(), month = calCursor.getMonth();
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-GB',{month:'long', year:'numeric'});
  let cells = '';
  const dows = ['S','M','T','W','T','F','S'];
  let head = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startDow;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dstr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const info = studentDayInfo(log[dstr], roll);
    const isToday = dstr===todayStr();
    let tick = '';
    if(info.status==='present') tick = info.held>=2 ? '<span class="tick">✓✓</span>' : '<span class="tick">✓</span>';
    else if(info.status==='partial') tick = '<span class="tick">✓</span>';
    else if(info.status==='absent') tick = '<span class="tick">✕</span>';
    else if(info.status==='cancelled') tick = '<span class="tick">●</span>';
    const cxdot = (info.held>0 && info.cancelled>0) ? '<span class="cxdot" title="One session cancelled"></span>' : '';
    cells += `<div class="cal-day ${info.status}${isToday?' today':''}">${d}${tick}${cxdot}</div>`;
  }
  return `
    <div class="cal-head">
      <button id="calPrev">‹</button>
      <b>${monthLabel}</b>
      <button id="calNext">›</button>
    </div>
    <div class="cal-grid">${head}${cells}</div>
    <div class="legend">
      <span><span class="dot" style="background:var(--green)"></span>Present ✓✓ (both sessions)</span>
      <span><span class="dot" style="background:var(--red)"></span>Absent ✕</span>
      <span><span class="dot" style="background:var(--blue)"></span>Partial ✓ (one session)</span>
      <span><span class="dot" style="background:#1e293b"></span>Both sessions cancelled</span>
      <span><span class="dot" style="background:#000;border-radius:50%;width:8px;height:8px;"></span>One session cancelled that day</span>
      <span><span class="dot" style="background:var(--gray-light);border:1px solid var(--border)"></span>No class</span>
    </div>
  `;
}

    downloadFile(`peds-attendance-grid-${todayStr()}.csv`, toCSV(rows), 'text/csv');
  };
  document.getElementById('exportRawBtn').onclick = ()=>{
    const rows = [['Date','Session','Status','Absent Roll Numbers']];
    Object.keys(log).sort().forEach(d=>{
      const e = log[d];
      ['morning','evening'].forEach(s=>{
        if(e[s]){
          rows.push([d, s, e[s].status, e[s].status==='held' ? (e[s].absentees||[]).join('; ') : '']);
        }
      });
    });
    downloadFile(`peds-attendance-log-${todayStr()}.csv`, toCSV(rows), 'text/csv');
  };
  document.getElementById('printFullBtn').onclick = ()=>{
    modalReportChoice('Full batch report', ()=>printReport(buildFullSummaryReportHTML(), true), ()=>imageReport(buildFullSummaryReportHTML(), `paedstrack-full-report-${todayStr()}.png`, true));
  };
}

function startDraft(dateVal){
  const existing = log[dateVal];
  editorDraft = {
    date: dateVal,
    morning: existing ? {...existing.morning, absentees: existing.morning.absentees ? [...existing.morning.absentees] : []} : {status:null, absentees:[]},
    evening: existing ? {...existing.evening, absentees: existing.evening.absentees ? [...existing.evening.absentees] : []} : {status:null, absentees:[]},
  };
}
function renderChips(containerId, session){
  const c = document.getElementById(containerId);
  if(!c) return;
  if(!session.absentees) session.absentees = [];
  if(students.length===0){ c.innerHTML = `<p class="muted">Add students to the roster first.</p>`; return; }
  c.innerHTML = students.map(s=>{
    const isAbsent = session.absentees.includes(s.roll);
    return `<span class="student-chip ${isAbsent?'absent':''}" data-roll="${s.roll}">${isAbsent?'✕':'✓'} ${s.roll}</span>`;
  }).join('');
  c.querySelectorAll('.student-chip').forEach(chip=>{
    chip.onclick = ()=>{
      const roll = chip.dataset.roll;
      const idx = session.absentees.indexOf(roll);
      if(idx>=0) session.absentees.splice(idx,1); else session.absentees.push(roll);
      renderChips(containerId, session);
    };
  });
}
function renderHistory(){
  const dates = Object.keys(log).sort().reverse();
  if(dates.length===0) return `<div class="empty-state"><div class="em">📭</div>No entries yet — add one above.</div>`;
  return dates.map(d=>{
    const e = log[d];
    const mAbs = (e.morning.absentees||[]).length;
    const eAbs = (e.evening.absentees||[]).length;
    const m = e.morning.status==='held' ? `AM ✓ (${mAbs} absent)` : 'AM cancelled';
    const ev = e.evening.status==='held' ? `PM ✓ (${eAbs} absent)` : 'PM cancelled';
    return `<div class="log-row" style="flex-wrap:wrap;">
      <span><b>${fmtNice(d)}</b><br><span class="muted">${m} · ${ev}</span></span>
      <span class="btn-row">
        <button class="pill-btn btn-sm" data-report="${d}">📄 Report</button>
        <button class="pill-btn btn-sm" data-edit="${d}">Edit</button>
        <button class="pill-btn btn-sm" data-del="${d}" style="color:var(--red);">Delete</button>
      </span>
    </div>`;
  }).join('');
}

document.getElementById('tab-editor').addEventListener('click', (e)=>{
  if(e.target.dataset.edit){
    startDraft(e.target.dataset.edit);
    renderEditor();
    setTimeout(()=>{ document.getElementById('entryDate').value = e.target.dataset.edit; }, 0);
    window.scrollTo({top:0, behavior:'smooth'});
  }
  if(e.target.dataset.del){
    const d = e.target.dataset.del;
    modalConfirm('Delete this entry?', `The attendance entry for ${fmtNice(d)} will be permanently deleted.`, async ()=>{
      delete log[d];
      await saveLog();
      toast('Entry deleted');
      renderEditor();
    });
  }
  if(e.target.dataset.report){
    const d = e.target.dataset.report;
    modalReportChoice(`Daily report — ${fmtNice(d)}`, ()=>printReport(buildDailyReportHTML(d)), ()=>imageReport(buildDailyReportHTML(d), `attendance-${d}.png`));
  }
});

function toCSV(rows){
  return rows.map(row => row.map(cell=>{
    const s = String(cell ?? '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(',')).join('\n');
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Download started ✅');
}

function printReport(html, wide){
  document.getElementById('printArea').innerHTML = `<div class="rpt${wide?' wide':''}">${html}</div>`;
  setTimeout(()=> window.print(), 50);
}
async function imageReport(html, filename, wide){
  if(typeof html2canvas==='undefined'){ toast('Image export unavailable offline — try Print instead'); return; }
  const area = document.getElementById('printArea');
  area.innerHTML = `<div class="rpt${wide?' wide':''}">${html}</div>`;
  area.style.cssText = 'display:block;position:fixed;left:-9999px;top:0;background:#fff;';
  await new Promise(r=>setTimeout(r,60));
  try{
    const canvas = await html2canvas(area.firstChild, {backgroundColor:'#ffffff', scale:2});
    canvas.toBlob(blob=>{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('Image saved ✅');
    });
  }catch(err){ toast('Could not generate image'); }
  area.style.cssText = '';
  area.innerHTML = '';
}
function reportHeader(subtitle){
  return `<div class="rpt-dept">Department of Paediatrics Medicine, Unit 1</div><h2>🩺 PaedsTrack B1</h2><div class="rpt-sub">Final Year MBBS · Batch B1${subtitle?' · '+subtitle:''}</div>`;
}
function dateCornerBox(dateStr, topLabel){
  const dt = new Date(dateStr+'T00:00:00');
  const dow = topLabel || dt.toLocaleDateString('en-GB',{weekday:'short'});
  const dnum = dt.getDate();
  const mon = dt.toLocaleDateString('en-GB',{month:'short'});
  return `<div class="date-box"><div class="dow">${dow}</div><div class="dnum">${dnum}</div><div class="mon">${mon}</div></div>`;
}
function buildDailyReportHTML(date){
  const e = log[date];
  const box = dateCornerBox(date);
  if(!e) return box + reportHeader(fmtNice(date)) + `<p>No attendance recorded for this date.</p>`;
  const sections = ['morning','evening'].map(s=>{
    const label = s==='morning' ? '☀️ MORNING SESSION' : '🌙 EVENING SESSION';
    if(e[s].status!=='held') return `<div class="rpt-section-title">${label} — CANCELLED</div><p class="rpt-cancelled-note">No session held.</p>`;
    const absentRolls = e[s].absentees || [];
    const present = students.filter(st=>!absentRolls.includes(st.roll));
    const absent = students.filter(st=>absentRolls.includes(st.roll));
    return `
      <div class="rpt-section-title">${label}</div>
      <div class="rpt-two-col">
        <div class="rpt-col">
          <div class="rpt-col-count" style="color:#15803d;">${present.length}</div>
          <div class="rpt-col-lbl" style="color:#15803d;">Present</div>
          <div class="rpt-col-rolls" style="color:#15803d;">${present.length ? present.map(s=>s.roll).join(', ') : '—'}</div>
        </div>
        <div class="rpt-col">
          <div class="rpt-col-count" style="color:#b91c1c;">${absent.length}</div>
          <div class="rpt-col-lbl" style="color:#b91c1c;">Absent</div>
          <div class="rpt-col-rolls" style="color:#b91c1c;">${absent.length ? absent.map(s=>s.roll).join(', ') : '—'}</div>
        </div>
      </div>
    `;
  }).join('');
  return `${box}${reportHeader(fmtNice(date))}${sections}<div class="rpt-foot">Generated by BR via PaedsTrack B1 · ${new Date().toLocaleString('en-GB')}</div>`;
}
function buildFullSummaryReportHTML(){
  const bs = batchStats();
  const dates = Object.keys(log).sort();
  const headDates = dates.map(d=>{
    const dt = new Date(d+'T00:00:00');
    return `<th colspan="2">${dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</th>`;
  }).join('');
  const subHead = dates.map(()=> `<th class="sub">AM</th><th class="sub">PM</th>`).join('');
  const cellFor = (d, roll)=>{
    const info = log[d];
    return ['morning','evening'].map(sess=>{
      const s = info[sess];
      if(!s || s.status!=='held') return `<td class="mx-c">–</td>`;
      const present = !(s.absentees||[]).includes(roll);
      return present ? `<td class="mx-p">P</td>` : `<td class="mx-a">A</td>`;
    }).join('');
  };
  const rows = students.map(s=>{
    const st = studentStats(s.roll);
    const c = tableColor(st.pct);
    const cells = dates.map(d=>cellFor(d, s.roll)).join('');
    return `<tr><td class="mx-name">${s.roll} — ${s.name}</td><td class="mx-pct" style="color:${st.held===0?'var(--ink-soft)':c.fg}">${st.held===0?'—':st.pct+'%'}</td>${cells}</tr>`;
  }).join('');
  return `${dateCornerBox(todayStr(),'as of')}${reportHeader('Full attendance summary')}
    <div class="rpt-two-col">
      <div class="rpt-col"><div class="rpt-col-count" style="color:var(--teal-dark);">${bs.heldSessions}</div><div class="rpt-col-lbl">Sessions held</div></div>
      <div class="rpt-col"><div class="rpt-col-count" style="color:var(--teal-dark);">${bs.avgPct}%</div><div class="rpt-col-lbl">Batch average</div></div>
    </div>
    <div class="rpt-section-title">Per-student attendance — day by day</div>
    <table class="matrix">
      <thead>
        <tr><th class="mx-name-h">Student</th><th>%</th>${headDates}</tr>
        <tr><th></th><th></th>${subHead}</tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="rpt-foot">P = present (green) · A = absent (red) · – = session cancelled · Generated ${new Date().toLocaleString('en-GB')}</div>`;
}
function buildStudentReportHTML(student){
  const st = studentStats(student.roll);
  const dates = Object.keys(log).sort();
  const rows = dates.map(d=>{
    const status = studentDayStatus(log[d], student.roll);
    if(status==='none') return '';
    const tick = status==='present' ? '✓✓ Present' : status==='partial' ? '✓ Partial' : '✕ Absent';
    return `<div class="rpt-row"><span>${fmtNice(d)}</span><span>${tick}</span></div>`;
  }).join('');
  return `${reportHeader(`${student.roll} — ${student.name}`)}
    <div class="rpt-grid">
      <div class="rpt-box"><div class="rpt-count" style="color:${tableColor(st.pct).fg}">${st.held===0?'—':st.pct+'%'}</div><div style="font-size:11px;color:var(--ink-soft);">Attendance</div></div>
      <div class="rpt-box"><div class="rpt-count">${st.attended}/${st.held}</div><div style="font-size:11px;color:var(--ink-soft);">Sessions</div></div>
    </div>
    <div class="rpt-section-title">Day-by-day (✓✓ = both sessions, ✓ = one session)</div>
    ${rows || '<p style="font-size:12.5px;color:var(--ink-soft);">No sessions recorded yet.</p>'}
    <div class="rpt-foot">Generated ${new Date().toLocaleString('en-GB')}</div>`;
}

window.handleBRLogin = handleBRLogin;

  await loadAll();
  renderBRStatus();

  renderHeroToday();
