<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaedsTrack B1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1e293b; --ink-soft:#64748b;
    --teal:#0d9488; --teal-dark:#0f766e; --teal-light:#e6f7f5;
    --amber:#f59e0b; --amber-light:#fef3e2;
    --green:#22c55e; --green-light:#dcfce7;
    --red:#ef4444; --red-light:#fee2e2;
    --blue:#3b82f6; --blue-light:#dbeafe;
    --gray:#cbd5e1; --gray-light:#f1f5f9;
    --border:#e2e8f0;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#ffffff;color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Poppins',sans-serif;}
  .wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px;}

  .hero{display:flex;align-items:center;gap:14px;padding:22px 4px 18px;border-bottom:1px solid var(--border);margin-bottom:18px;}
  .hero-badge{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;box-shadow:var(--shadow);}
  .hero h1{font-size:20px;margin:0;font-weight:700;line-height:1.25;}
  .hero p{margin:2px 0 0;color:var(--ink-soft);font-size:13px;font-weight:500;}
  .hero-right{margin-left:auto;}

  .pill-btn{border:1px solid var(--border);background:#fff;color:var(--ink);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:.15s;}
  .pill-btn:hover{border-color:var(--teal);color:var(--teal-dark);}
  .pill-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;}

  .tabs{display:flex;gap:8px;margin-bottom:22px;overflow-x:auto;padding-bottom:2px;}
  .tab{padding:9px 16px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink-soft);white-space:nowrap;transition:.15s;}
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  .card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.grid2{grid-template-columns:1fr;}}

  .stat-box{background:var(--gray-light);border-radius:14px;padding:16px;text-align:center;}
  .stat-num{font-family:'Poppins',sans-serif;font-size:26px;font-weight:800;color:var(--teal-dark);}
  .stat-lbl{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:2px;}

  .ring-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .ring{width:118px;height:118px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;}
  .ring-inner{width:92px;height:92px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-pct{font-family:'Poppins',sans-serif;font-weight:800;font-size:22px;}
  .ring-pct-lbl{font-size:10px;color:var(--ink-soft);font-weight:600;}

  .bar-track{background:var(--gray-light);border-radius:999px;height:10px;overflow:hidden;margin-top:8px;}
  .bar-fill{height:100%;border-radius:999px;transition:width .4s;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;}
  .badge.green{background:var(--green-light);color:#15803d;}
  .badge.red{background:var(--red-light);color:#b91c1c;}
  .badge.amber{background:var(--amber-light);color:#b45309;}

  .search-box{position:relative;}
  .search-box input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:14px;font-size:15px;font-family:'Inter',sans-serif;outline:none;transition:.15s;}
  .search-box input:focus{border-color:var(--teal);}
  .suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);max-height:260px;overflow-y:auto;z-index:20;}
  .suggest-item{padding:11px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--gray-light);}
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item:hover{background:var(--teal-light);}
  .suggest-item b{color:var(--teal-dark);}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-head button{border:none;background:var(--gray-light);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-size:10.5px;font-weight:700;color:var(--ink-soft);text-align:center;padding-bottom:4px;}
  .cal-day{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;position:relative;}
  .cal-day.empty{visibility:hidden;}
  .cal-day.present{background:var(--green);color:#fff;}
  .cal-day.absent{background:var(--red);color:#fff;}
  .cal-day.partial{background:var(--blue);color:#fff;}
  .cal-day.none{background:var(--gray-light);color:var(--ink-soft);font-weight:600;}
  .cal-day.today{box-shadow:0 0 0 2px var(--ink);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink-soft);font-weight:600;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}

  textarea, input[type=text], input[type=password], input[type=date], select{font-family:'Inter',sans-serif;}
  .field label{font-size:12.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .field input, .field textarea, .field select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;}
  .field input:focus, .field textarea:focus{border-color:var(--teal);}
  .btn{background:var(--teal);color:#fff;border:none;padding:11px 20px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn:hover{background:var(--teal-dark);}
  .btn.ghost{background:#fff;border:1.5px solid var(--border);color:var(--ink);}
  .btn.danger{background:#fff;border:1.5px solid var(--red);color:var(--red);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}
  .btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px;}

  .session-toggle{display:flex;gap:8px;margin-bottom:10px;}
  .session-toggle button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-weight:700;font-size:13px;cursor:pointer;}
  .session-toggle button.on{background:var(--teal);border-color:var(--teal);color:#fff;}
  .session-toggle button.cancel-on{background:var(--red);border-color:var(--red);color:#fff;}

  .student-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1.5px solid var(--border);font-size:12.5px;font-weight:600;cursor:pointer;margin:3px;}
  .student-chip.absent{background:var(--red-light);border-color:var(--red);color:#b91c1c;}
  .chip-list{display:flex;flex-wrap:wrap;margin:-3px;max-height:260px;overflow-y:auto;padding:2px;}

  .log-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--gray-light);font-size:13px;gap:10px;}
  .log-row:last-child{border-bottom:none;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty-state .em{font-size:34px;margin-bottom:8px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .muted{color:var(--ink-soft);font-size:12.5px;}
  .hidden{display:none !important;}

  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:150;padding:20px;}
  .modal-box{background:#fff;border-radius:18px;padding:22px;max-width:360px;width:100%;box-shadow:var(--shadow);text-align:center;}
  .modal-box .em{font-size:34px;margin-bottom:8px;}
  .modal-box h3{margin:0 0 6px;font-size:16px;}
  .modal-box p{margin:0 0 16px;color:var(--ink-soft);font-size:13px;}
  .modal-box input{width:100%;text-align:center;letter-spacing:3px;font-size:18px;padding:12px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:14px;font-family:'Inter',sans-serif;outline:none;}
  .modal-box input:focus{border-color:var(--teal);}
  .file-input-label{display:inline-block;background:#fff;border:1.5px solid var(--border);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;}
  .file-input-label input{display:none;}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="hero-badge">🩺</div>
    <div>
      <h1>PaedsTrack B1</h1>
      <p>Paeds Unit 1 · Final Year MBBS · Batch B1</p>
    </div>
    <div class="hero-right" id="brStatusArea"></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="search">🔍 Find My Attendance</div>
    <div class="tab" data-tab="overview">🏠 Overview</div>
    <div class="tab" data-tab="editor">🛠 BR Panel</div>
  </div>

  <div id="tab-search"></div>
  <div id="tab-overview" class="hidden"></div>
  <div id="tab-editor" class="hidden"></div>

</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
const DB_URL = "https://peadstrack-default-rtdb.firebaseio.com/"; 

const TARGET = 75;
const BR_PIN = '551555';
function genPin(){ return String(Math.floor(1000 + Math.random()*9000)); }

const SEED_STUDENTS = [
  {roll:'11', name:'Amna Khalid', pin:'8033'}, 
  {roll:'54', name:'Fatima Shahid', pin:'8341'},
  {roll:'75', name:'Iman Ahmad', pin:'2677'}, 
  {roll:'76', name:'Inshrah Qureshi', pin:'1410'},
  {roll:'77', name:'Iqra Amir', pin:'9016'}, 
  {roll:'78', name:'Ishmal Fatima Shahid', pin:'5829'},
  {roll:'95', name:'Maham Ashraf', pin:'7199'}, 
  {roll:'111', name:'Nabiha Tahir', pin:'4193'},
  {roll:'120', name:'Rahmeen Nauman', pin:'5611'}, 
  {roll:'158', name:'Abdullah Khan', pin:'6655'},
  {roll:'161', name:'Abdur Rahman', pin:'3040'}, 
  {roll:'162', name:'Adil Hameed', pin:'3559'},
  {roll:'180', name:'Awais Nazir', pin:'9915'}, 
  {roll:'196', name:'Hasnat Ahmed Liaquat', pin:'6300'},
  {roll:'241', name:'Muhammad Faisal Zaheer', pin:'2904'}, 
  {roll:'245', name:'Muhammad Haad Munir Chaudhry', pin:'4980'},
  {roll:'247', name:'Muhammad Hamza Naseer Awan', pin:'5380'}, 
  {roll:'267', name:'Muhammad Shaafay Khan', pin:'4550'},
  {roll:'286', name:'Muhammad Waleed Abdullah', pin:'8065'}, 
  {roll:'293', name:'Omar Abdullah Gill', pin:'8185'},
  {roll:'348', name:'Azmir Ali Khan', pin:'1373'}
];

let students = [];
let log = {};
let isEditor = false;
let editorDraft = null;
let selectedStudent = null;
let unlockedRoll = null;
let calCursor = new Date();
let casePresenter = null;

// ---------- Firebase API helpers ----------
async function dbFetch(path) {
  try {
    const res = await fetch(`${DB_URL}${path}.json`);
    return await res.json();
  } catch (e) {
    console.error(e);
    return null;
  }
}

async function dbPut(path, data) {
  try {
    await fetch(`${DB_URL}${path}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
  } catch (e) {
    console.error(e);
  }
}

// ---------- Live storage helpers ----------
async function loadAll(){
  const dbRoster = await dbFetch('roster');
  if(!dbRoster) {
    students = SEED_STUDENTS;
    await saveStudents();
  } else {
    students = dbRoster;
    let migrated = false;
    students = students.map(s=>{
      if(!s.pin){ migrated = true; return {...s, pin: genPin()}; }
      return s;
    });
    if(migrated) await saveStudents();
  }
  
  const dbLog = await dbFetch('attendance-log');
  log = dbLog || {};

  const dbPresenter = await dbFetch('case-presenter');
  casePresenter = dbPresenter || null;
}

async function saveCasePresenter(){
  await dbPut('case-presenter', casePresenter);
}
async function saveStudents(){ 
  await dbPut('roster', students); 
}
async function saveLog(){ 
  await dbPut('attendance-log', log); 
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

// ---------- modal system ----------
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function modalPinEntry(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal-box">
        <div class="em">🔒</div>
        <h3>Enter BR PIN</h3>
        <p>Only the batch representative should have this.</p>
        <input type="password" id="pinInput" inputmode="numeric">
        <div id="pinError" class="muted" style="color:var(--red);margin:-8px 0 12px;display:none;">Incorrect PIN, try again.</div>
        <div class="btn-row" style="justify-content:center;">
          <button class="btn ghost btn-sm" id="cancelBtn">Cancel</button>
          <button class="btn btn-sm" id="submitBtn">Unlock</button>
        </div>
      </div>
    </div>`;
  document.getElementById('cancelBtn').onclick = closeModal;
  const submit = ()=>{
    const val = document.getElementById('pinInput').value.trim();
    if(val===BR_PIN){
      isEditor = true;
      closeModal();
      toast('Unlocked BR panel ✅');
      renderBRStatus(); renderActiveTab();
    } else {
      document.getElementById('pinError').style.display = 'block';
    }
  };
  document.getElementById('submitBtn').onclick = submit;
  document.getElementById('pinInput').onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
}
function modalConfirm(title, desc, onYes){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal-box">
        <div class="em">⚠️</div>
        <h3>${title}</h3>
        <p>${desc}</p>
        <div class="btn-row" style="justify-content:center;">
          <button class="btn ghost btn-sm" id="noBtn">Cancel</button>
          <button class="btn danger btn-sm" id="yesBtn">Yes, continue</button>
        </div>
      </div>
    </div>`;
  document.getElementById('noBtn').onclick = closeModal;
  document.getElementById('yesBtn').onclick = ()=>{ closeModal(); onYes(); };
}

function handleBRLogin(){
  modalPinEntry();
}

// ---------- attendance math ----------
function studentDayStatus(entry, roll){
  if(!entry) return 'none';
  let held=0, attended=0;
  ['morning','evening'].forEach(s=>{
    if(entry[s]?.status==='held'){
      held++;
      if(!entry[s].absentees) entry[s].absentees = [];
      if(!entry[s].absentees.includes(roll)) attended++;
    }
  });
  if(held===0) return 'none';
  if(attended===held) return 'present';
  if(attended===0) return 'absent';
  return 'partial';
}
function studentStats(roll){
  let held=0, attended=0;
  Object.values(log).forEach(entry=>{
    ['morning','evening'].forEach(s=>{
      if(entry[s]?.status==='held'){
        held++;
        if(!entry[s].absentees) entry[s].absentees = [];
        if(!entry[s].absentees.includes(roll)) attended++;
      }
    });
  });
  const pct = held===0 ? 100 : Math.round((attended/held)*1000)/10;
  let needed = 0;
  if(held>0 && pct < TARGET){
    needed = Math.ceil((0.75*held - attended)/0.25);
    if(needed<0) needed=0;
  }
  return {held, attended, pct, needed};
}
function batchStats(){
  let heldSessions=0, cancelledSessions=0;
  Object.values(log).forEach(entry=>{
    ['morning','evening'].forEach(s=>{
      if(entry[s]?.status==='held') heldSessions++;
      else if(entry[s]?.status==='cancelled') cancelledSessions++;
    });
  });
  let sum=0, count=0;
  students.forEach(st=>{
    const s = studentStats(st.roll);
    if(s.held>0){ sum += s.pct; count++; }
  });
  const avgPct = count>0 ? Math.round((sum/count)*10)/10 : 0;
  return {heldSessions, cancelledSessions, avgPct, totalDays: Object.keys(log).length};
}
function pctColor(pct){
  if(pct>=TARGET) return 'var(--green)';
  if(pct>=TARGET-10) return 'var(--amber)';
  return 'var(--red)';
}
function fmtDate(d){ return d.toISOString().slice(0,10); }
function todayStr(){ return fmtDate(new Date()); }
function fmtNice(dstr){
  const d = new Date(dstr+'T00:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'});
}

// ---------- header ----------
function renderBRStatus(){
  const el = document.getElementById('brStatusArea');
  if(isEditor){
    el.innerHTML = `<button class="pill-btn active">👑 BR mode</button>`;
  } else {
    el.innerHTML = `<button class="pill-btn" id="brLoginBtn">🔑 BR Login</button>`;
    document.getElementById('brLoginBtn').onclick = handleBRLogin;
  }
}

// ---------- tabs ----------
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = async ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    ['overview','search','editor'].forEach(name=>{
      document.getElementById('tab-'+name).classList.toggle('hidden', name!==t.dataset.tab);
    });
    await loadAll();
    renderActiveTab(t.dataset.tab);
  };
});
function renderActiveTab(which){
  const active = which || document.querySelector('.tab.active').dataset.tab;
  if(active==='overview') renderOverview();
  if(active==='search') renderSearch();
  if(active==='editor') renderEditor();
}

// ================= OVERVIEW =================
function renderOverview(){
  const el = document.getElementById('tab-overview');
  const bs = batchStats();
  el.innerHTML = `
    ${renderPresenterBanner()}
    <div class="card" style="padding:16px 18px;">
      <h3 style="margin-bottom:10px;">📊 Ward overview</h3>
      <div class="grid2" style="gap:10px;">
        <div class="stat-box" style="padding:11px;"><div class="stat-num" style="font-size:20px;">${bs.heldSessions}</div><div class="stat-lbl">Sessions held</div></div>
        <div class="stat-box" style="padding:11px;"><div class="stat-num" style="font-size:20px;">${bs.cancelledSessions}</div><div class="stat-lbl">Cancelled</div></div>
        <div class="stat-box" style="padding:11px;"><div class="stat-num" style="font-size:20px;">${students.length}</div><div class="stat-lbl">Students</div></div>
        <div class="stat-box" style="padding:11px;"><div class="stat-num" style="font-size:20px;color:${pctColor(bs.avgPct)}">${bs.avgPct}%</div><div class="stat-lbl">Batch avg.</div></div>
      </div>
      <div class="bar-track" style="margin-top:12px;"><div class="bar-fill" style="width:${Math.min(bs.avgPct,100)}%;background:${pctColor(bs.avgPct)}"></div></div>
      <p class="muted" style="margin:6px 0 0;">${bs.avgPct>=TARGET ? `Above the ${TARGET}% target 🎉` : `${(TARGET-bs.avgPct).toFixed(1)} points below the ${TARGET}% target.`}</p>
    </div>
    <div class="card" style="padding:16px 18px;">
      <h3 style="margin-bottom:6px;">🗓 Recent activity</h3>
      ${renderRecentLog()}
    </div>
  `;
}
function renderPresenterBanner(){
  if(!casePresenter || !casePresenter.roll) return '';
  const st = students.find(s=>s.roll===casePresenter.roll);
  const name = st ? st.name : 'Unknown student';
  return `
    <div class="card" style="padding:14px 18px;background:linear-gradient(135deg,var(--teal-light),#fff);border-color:var(--teal);">
      <h3 style="margin-bottom:4px;">🎤 Presenting case</h3>
      <div style="font-size:15px;font-weight:700;">${casePresenter.roll} — ${name}</div>
      ${casePresenter.topic ? `<div class="muted" style="margin-top:2px;">Topic: ${casePresenter.topic}</div>` : ''}
    </div>
  `;
}
function renderRecentLog(){
  const dates = Object.keys(log).sort().reverse().slice(0,4);
  if(dates.length===0) return `<p class="muted">No attendance entries yet.</p>`;
  return dates.map(d=>{
    const e = log[d];
    const m = e.morning?.status==='held' ? `<span class="badge green">AM ✓</span>` : e.morning?.status==='cancelled' ? `<span class="badge red">AM ✕</span>` : '';
    const ev = e.evening?.status==='held' ? `<span class="badge green">PM ✓</span>` : e.evening?.status==='cancelled' ? `<span class="badge red">PM ✕</span>` : '';
    return `<div class="log-row"><span>${fmtNice(d)}</span><span>${m} ${ev}</span></div>`;
  }).join('');
}

// ================= SEARCH =================
function renderSearch(){
  const el = document.getElementById('tab-search');
  el.innerHTML = `
    <div class="card">
      <h3>🔍 Find my attendance</h3>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Type your roll number or name…" autocomplete="off">
        <div class="suggest hidden" id="suggestBox"></div>
      </div>
    </div>
    <div id="studentResult"></div>
  `;
  const input = document.getElementById('searchInput');
  const box = document.getElementById('suggestBox');
  input.oninput = ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ box.classList.add('hidden'); return; }
    const matches = students.filter(s=> s.roll.toLowerCase().includes(q) || s.name.toLowerCase().includes(q)).slice(0,8);
    if(matches.length===0){ box.innerHTML = `<div class="suggest-item muted">No matching student</div>`; box.classList.remove('hidden'); return; }
    box.innerHTML = matches.map(s=>`<div class="suggest-item" data-roll="${s.roll}"><b>${s.roll}</b> — ${s.name}</div>`).join('');
    box.classList.remove('hidden');
    box.querySelectorAll('.suggest-item').forEach(item=>{
      item.onclick = ()=>{
        const roll = item.dataset.roll;
        if(!roll) return;
        const student = students.find(s=>s.roll===roll);
        input.value = `${student.roll} — ${student.name}`;
        box.classList.add('hidden');
        if(unlockedRoll===roll){
          selectedStudent = student;
          calCursor = new Date();
          renderStudentResult();
        } else {
          modalStudentPin(student, ()=>{
            selectedStudent = student;
            unlockedRoll = roll;
            calCursor = new Date();
            renderStudentResult();
          });
        }
      };
    });
  };
  if(selectedStudent && unlockedRoll===selectedStudent.roll) renderStudentResult();
}
function modalStudentPin(student, onSuccess){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal-box">
        <div class="em">🔒</div>
        <h3>${student.name}'s attendance</h3>
        <p>Enter your personal PIN to view your record. Only you should know this — ask your BR if you've forgotten it.</p>
        <input type="password" id="studentPinInput" inputmode="numeric" maxlength="6">
        <div id="studentPinError" class="muted" style="color:var(--red);margin:-8px 0 12px;display:none;">Incorrect PIN, try again.</div>
        <div class="btn-row" style="justify-content:center;">
          <button class="btn ghost btn-sm" id="cancelBtn">Cancel</button>
          <button class="btn btn-sm" id="submitBtn">View</button>
        </div>
      </div>
    </div>`;
  document.getElementById('cancelBtn').onclick = closeModal;
  const submit = ()=>{
    const val = document.getElementById('studentPinInput').value.trim();
    if(val===student.pin){
      closeModal();
      onSuccess();
    } else {
      document.getElementById('studentPinError').style.display = 'block';
    }
  };
  document.getElementById('submitBtn').onclick = submit;
  document.getElementById('studentPinInput').onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
}
function renderStudentResult(){
  const el = document.getElementById('studentResult');
  if(!selectedStudent){ el.innerHTML=''; return; }
  const s = studentStats(selectedStudent.roll);
  const color = pctColor(s.pct);
  el.innerHTML = `
    <div class="card">
      <h3>👤 ${selectedStudent.name} <span class="muted">(${selectedStudent.roll})</span></h3>
      <div class="ring-wrap">
        <div class="ring" style="background:conic-gradient(${color} ${s.pct*3.6}deg, var(--gray-light) 0deg);">
          <div class="ring-inner">
            <div class="ring-pct" style="color:${color}">${s.pct}%</div>
            <div class="ring-pct-lbl">attendance</div>
          </div>
        </div>
        <div style="flex:1;min-width:180px;">
          <div class="muted" style="margin-bottom:6px;">${s.attended} of ${s.held} sessions attended</div>
          ${s.pct>=TARGET
            ? `<span class="badge green">✓ Above ${TARGET}% target</span>`
            : s.needed>0
              ? `<span class="badge red">Needs ${s.needed} more consecutive present session${s.needed>1?'s':''} to reach ${TARGET}%</span>`
              : `<span class="badge amber">No sessions recorded yet</span>`
          }
        </div>
      </div>
    </div>
    <div class="card">
      <h3>🗓 Monthly calendar</h3>
      ${renderCalendar(selectedStudent.roll)}
    </div>
  `;
  document.getElementById('calPrev').onclick = ()=>{ calCursor.setMonth(calCursor.getMonth()-1); renderStudentResult(); };
  document.getElementById('calNext').onclick = ()=>{ calCursor.setMonth(calCursor.getMonth()+1); renderStudentResult(); };
}
function renderCalendar(roll){
  const year = calCursor.getFullYear(), month = calCursor.getMonth();
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-GB',{month:'long', year:'numeric'});
  let cells = '';
  const dows = ['S','M','T','W','T','F','S'];
  let head = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startDow;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dstr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const status = studentDayStatus(log[dstr], roll);
    const isToday = dstr===todayStr();
    cells += `<div class="cal-day ${status}${isToday?' today':''}">${d}</div>`;
  }
  return `
    <div class="cal-head">
      <button id="calPrev">‹</button>
      <b>${monthLabel}</b>
      <button id="calNext">›</button>
    </div>
    <div class="cal-grid">${head}${cells}</div>
    <div class="legend">
      <span><span class="dot" style="background:var(--green)"></span>Present</span>
      <span><span class="dot" style="background:var(--red)"></span>Absent</span>
      <span><span class="dot" style="background:var(--blue)"></span>Partial</span>
      <span><span class="dot" style="background:var(--gray-light);border:1px solid var(--border)"></span>No class</span>
    </div>
  `;
}

// ================= EDITOR (BR) =================
function renderEditor(){
  const el = document.getElementById('tab-editor');
  if(!isEditor){
    el.innerHTML = `
      <div class="card" style="max-width:360px;margin:40px auto;text-align:center;">
        <div style="font-size:38px;">🔒</div>
        <h3>BR access required</h3>
        <p class="muted">Only the batch representative can enter or edit attendance. Everyone else can view via "Find My Attendance".</p>
        <button class="btn" id="unlockBtn">🔑 Unlock BR Panel</button>
      </div>
    `;
    document.getElementById('unlockBtn').onclick = handleBRLogin;
    return;
  }
  const dateVal = editorDraft?.date || todayStr();
  if(!editorDraft) startDraft(dateVal);

  el.innerHTML = `
    <div class="card">
      <h3>🎤 Case presentation</h3>
      <p class="muted" style="margin-top:-6px;">Shown at the top of Overview for everyone to see.</p>
      <div class="field">
        <label>Student</label>
        <select id="presenterSelect">
          <option value="">— Select student —</option>
          ${students.map(s=>`<option value="${s.roll}" ${casePresenter?.roll===s.roll?'selected':''}>${s.roll} — ${s.name}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Topic (optional)</label>
        <input type="text" id="presenterTopic" placeholder="e.g. Nephrotic syndrome" value="${casePresenter?.topic ? casePresenter.topic.replace(/"/g,'&quot;') : ''}">
      </div>
      <div class="btn-row">
        <button class="btn" id="savePresenterBtn">Set presenter</button>
        ${casePresenter?.roll ? `<button class="btn ghost" id="clearPresenterBtn">Clear</button>` : ''}
      </div>
    </div>

    <div class="card">
      <h3>👥 Manage roster <span class="muted">(${students.length} students)</span></h3>
      <p class="muted" style="margin-top:-6px;">Each student gets a private 4-digit PIN so only they can view their own record.</p>
      <div class="field">
        <label>Add students — "Roll, Name" or "Roll, Name, PIN" one per line</label>
        <textarea id="bulkRoster" rows="3" placeholder="349, Full Name&#10;350, Another Name, 4821"></textarea>
      </div>
      <div class="btn-row"><button class="btn" id="addRosterBtn">➕ Add to roster</button></div>
      <div style="margin-top:14px;max-height:220px;overflow-y:auto;">
        ${students.length===0 ? `<p class="muted">No students added yet.</p>` :
          students.map(s=>`<div class="log-row"><span><b>${s.roll}</b> — ${s.name} <span class="muted">· PIN ${s.pin||'—'}</span></span><span class="btn-row"><button class="pill-btn btn-sm" data-reset="${s.roll}">Reset PIN</button><span style="cursor:pointer;color:var(--red);font-weight:700;" data-remove="${s.roll}">Remove</span></span></div>`).join('')}
      </div>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn ghost btn-sm" id="exportPinsBtn">⬇️ Export roster + PINs (CSV)</button>
      </div>
    </div>

    <div class="card">
      <h3>📝 Mark daily attendance</h3>
      <div class="field">
        <label>Date</label>
        <input type="date" id="entryDate" value="${dateVal}">
      </div>

      <div class="field">
        <label>☀️ Morning class</label>
        <div class="session-toggle">
          <button id="amHeld" class="${editorDraft.morning.status==='held'?'on':''}">Held</button>
          <button id="amCancel" class="${editorDraft.morning.status==='cancelled'?'cancel-on':''}">Cancelled</button>
        </div>
        <div id="amChips" class="${editorDraft.morning.status==='held'?'':'hidden'}">
          <div class="btn-row" style="margin-bottom:8px;">
            <button class="btn ghost btn-sm" id="amAllPresent">Mark all present</button>
          </div>
          <div class="chip-list" id="amChipList"></div>
        </div>
      </div>

      <div class="field">
        <label>🌙 Evening class</label>
        <div class="session-toggle">
          <button id="pmHeld" class="${editorDraft.evening.status==='held'?'on':''}">Held</button>
          <button id="pmCancel" class="${editorDraft.evening.status==='cancelled'?'cancel-on':''}">Cancelled</button>
        </div>
        <div id="pmChips" class="${editorDraft.evening.status==='held'?'':'hidden'}">
          <div class="btn-row" style="margin-bottom:8px;">
            <button class="btn ghost btn-sm" id="pmAllPresent">Mark all present</button>
          </div>
          <div class="chip-list" id="pmChipList"></div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn" id="saveEntryBtn">💾 Save this day</button>
      </div>
    </div>

    <div class="card">
      <h3>📜 Entry history</h3>
      ${renderHistory()}
    </div>

    <div class="card">
      <h3>💾 Backup &amp; export</h3>
      <p class="muted" style="margin-top:-6px;">Keep a copy in case anything goes wrong.</p>
      <div class="btn-row">
        <button class="btn ghost btn-sm" id="exportBackupBtn">⬇️ Download full backup (JSON)</button>
        <label class="file-input-label btn-sm">⬆️ Restore from backup<input type="file" id="restoreInput" accept="application/json"></label>
      </div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn ghost btn-sm" id="exportSummaryBtn">⬇️ Attendance summary (CSV)</button>
        <button class="btn ghost btn-sm" id="exportRawBtn">⬇️ Raw daily log (CSV)</button>
      </div>
    </div>
  `;

  // case presenter handlers
  document.getElementById('savePresenterBtn').onclick = async ()=>{
    const roll = document.getElementById('presenterSelect').value;
    const topic = document.getElementById('presenterTopic').value.trim();
    if(!roll){ toast('Select a student first'); return; }
    casePresenter = {roll, topic};
    await saveCasePresenter();
    toast('Case presenter set ✅');
    renderEditor();
  };
  const clearBtn = document.getElementById('clearPresenterBtn');
  if(clearBtn) clearBtn.onclick = async ()=>{
    casePresenter = null;
    await saveCasePresenter();
    toast('Cleared');
    renderEditor();
  };

  // roster handlers
  document.getElementById('addRosterBtn').onclick = async ()=>{
    const raw = document.getElementById('bulkRoster').value.trim();
    if(!raw) return;
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    let added = 0;
    lines.forEach(line=>{
      const parts = line.split(',').map(p=>p.trim());
      if(parts.length<2) return;
      const rollTrim = parts[0];
      if(!rollTrim) return;
      let pin = null, nameParts = parts.slice(1);
      const last = parts[parts.length-1];
      if(parts.length>=3 && /^\d{3,6}$/.test(last)){
        pin = last;
        nameParts = parts.slice(1, -1);
      }
      const name = nameParts.join(', ').trim();
      if(!name) return;
      if(!students.find(s=>s.roll===rollTrim)){
        students.push({roll: rollTrim, name, pin: pin || genPin()});
        added++;
      }
    });
    students.sort((a,b)=> a.roll.localeCompare(b.roll, undefined, {numeric:true}));
    await saveStudents();
    toast(`Added ${added} student${added!==1?'s':''} ✅`);
    renderEditor();
  };
  el.querySelectorAll('[data-remove]').forEach(x=>{
    x.onclick = ()=>{
      modalConfirm('Remove student?', `${x.dataset.remove} will be removed from the roster.`, async ()=>{
        students = students.filter(s=>s.roll!==x.dataset.remove);
        await saveStudents();
        toast('Student removed');
        renderEditor();
      });
    };
  });
  el.querySelectorAll('[data-reset]').forEach(x=>{
    x.onclick = ()=>{
      modalConfirm('Reset PIN?', `A new PIN will be generated for roll ${x.dataset.reset}.`, async ()=>{
        const st = students.find(s=>s.roll===x.dataset.reset);
        if(st){
          st.pin = genPin();
          if(unlockedRoll===st.roll) unlockedRoll = null;
          await saveStudents();
          toast(`New PIN for ${st.roll}: ${st.pin}`);
          renderEditor();
        }
      });
    };
  });
  document.getElementById('exportPinsBtn').onclick = ()=>{
    const rows = [['Roll No','Name','PIN']];
    students.forEach(s=> rows.push([s.roll, s.name, s.pin||'']));
    downloadFile(`paedstrack-roster-pins-${todayStr()}.csv`, toCSV(rows), 'text/csv');
  };

  document.getElementById('entryDate').onchange = (e)=>{ startDraft(e.target.value); renderEditor(); };

  document.getElementById('amHeld').onclick = ()=>{ editorDraft.morning.status='held'; renderEditor(); };
  document.getElementById('amCancel').onclick = ()=>{ editorDraft.morning.status='cancelled'; renderEditor(); };
  document.getElementById('pmHeld').onclick = ()=>{ editorDraft.evening.status='held'; renderEditor(); };
  document.getElementById('pmCancel').onclick = ()=>{ editorDraft.evening.status='cancelled'; renderEditor(); };

  renderChips('amChipList', editorDraft.morning);
  renderChips('pmChipList', editorDraft.evening);
  const amAll = document.getElementById('amAllPresent');
  const pmAll = document.getElementById('pmAllPresent');
  if(amAll) amAll.onclick = ()=>{ editorDraft.morning.absentees=[]; renderChips('amChipList', editorDraft.morning); };
  if(pmAll) pmAll.onclick = ()=>{ editorDraft.evening.absentees=[]; renderChips('pmChipList', editorDraft.evening); };

  document.getElementById('saveEntryBtn').onclick = async ()=>{
    const d = document.getElementById('entryDate').value;
    if(!d){ toast('Pick a date first'); return; }
    if(editorDraft.morning.status===null || editorDraft.evening.status===null){
      toast('Set both morning and evening status (held/cancelled)'); return;
    }
    log[d] = { morning: {...editorDraft.morning}, evening: {...editorDraft.evening} };
    await saveLog();
    toast(`Saved attendance for ${fmtNice(d)} ✅`);
    editorDraft = null;
    renderEditor();
  };

  // backup / export
  document.getElementById('exportBackupBtn').onclick = ()=>{
    const backup = { exportedAt: new Date().toISOString(), students, log };
    downloadFile(`peds-attendance-backup-${todayStr()}.json`, JSON.stringify(backup, null, 2), 'application/json');
  };
  document.getElementById('restoreInput').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      modalConfirm('Restore from backup?', 'This will replace the current roster and attendance log with the contents of the file you selected.', async ()=>{
        try{
          const data = JSON.parse(reader.result);
          if(!data.students || !data.log) throw new Error('bad format');
          students = data.students;
          log = data.log;
          await saveStudents();
          await saveLog();
          toast('Backup restored ✅');
          renderEditor();
        }catch(err){
          toast('Could not read that file — is it a valid backup?');
        }
      });
    };
    reader.readAsText(file);
    e.target.value = '';
  };
  
  // Custom Dynamic Multi-Column Grid Export (Individual Dates + AM/PM status + Totals + Percentage)
  document.getElementById('exportSummaryBtn').onclick = ()=>{
    const sortedDates = Object.keys(log).sort();
    const headers = ['Roll No', 'Name'];
    
    // Create dual headers for each date (AM and PM)
    sortedDates.forEach(d => {
      headers.push(`${d} (AM)`);
      headers.push(`${d} (PM)`);
    });
    
    headers.push('Sessions Held', 'Sessions Attended', 'Attendance %', 'Needed for 75%');
    
    const rows = [headers];
    
    students.forEach(s => {
      const row = [s.roll, s.name];
      
      // Calculate active attendance for each date
      sortedDates.forEach(d => {
        const entry = log[d];
        
        // Morning (AM) Status
        if (entry.morning?.status === 'held') {
          const isAbs = entry.morning.absentees?.includes(s.roll);
          row.push(isAbs ? 'A' : 'P');
        } else {
          row.push('—'); // Cancelled/Not held
        }
        
        // Evening (PM) Status
        if (entry.evening?.status === 'held') {
          const isAbs = entry.evening.absentees?.includes(s.roll);
          row.push(isAbs ? 'A' : 'P');
        } else {
          row.push('—'); // Cancelled/Not held
        }
      });
      
      // Append Overall Statistics
      const st = studentStats(s.roll);
      row.push(st.held, st.attended, `${st.pct}%`, st.needed);
      rows.push(row);
    });
    
    downloadFile(`peds-attendance-grid-${todayStr()}.csv`, toCSV(rows), 'text/csv');
  };
  
  document.getElementById('exportRawBtn').onclick = ()=>{
    const rows = [['Date','Session','Status','Absent Roll Numbers']];
    Object.keys(log).sort().forEach(d=>{
      const e = log[d];
      ['morning','evening'].forEach(s=>{
        if(e[s]){
          rows.push([d, s, e[s].status, e[s].status==='held' ? (e[s].absentees ? e[s].absentees.join('; ') : '') : '']);
        }
      });
    });
    downloadFile(`peds-attendance-log-${todayStr()}.csv`, toCSV(rows), 'text/csv');
  };
}

function startDraft(dateVal){
  const existing = log[dateVal];
  editorDraft = {
    date: dateVal,
    morning: existing ? {...existing.morning, absentees: existing.morning.absentees ? [...existing.morning.absentees] : []} : {status:null, absentees:[]},
    evening: existing ? {...existing.evening, absentees: existing.evening.absentees ? [...existing.evening.absentees] : []} : {status:null, absentees:[]},
  };
}
function renderChips(containerId, session){
  const c = document.getElementById(containerId);
  if(!c) return;
  if(students.length===0){ c.innerHTML = `<p class="muted">Add students to the roster first.</p>`; return; }
  if(!session.absentees) session.absentees = [];
  c.innerHTML = students.map(s=>{
    const isAbsent = session.absentees.includes(s.roll);
    return `<span class="student-chip ${isAbsent?'absent':''}" data-roll="${s.roll}">${isAbsent?'✕':'✓'} ${s.roll}</span>`;
  }).join('');
  c.querySelectorAll('.student-chip').forEach(chip=>{
    chip.onclick = ()=>{
      const roll = chip.dataset.roll;
      const idx = session.absentees.indexOf(roll);
      if(idx>=0) session.absentees.splice(idx,1); else session.absentees.push(roll);
      renderChips(containerId, session);
    };
  });
}
function renderHistory(){
  const dates = Object.keys(log).sort().reverse();
  if(dates.length===0) return `<div class="empty-state"><div class="em">📭</div>No entries yet — add one above.</div>`;
  return dates.map(d=>{
    const e = log[d];
    const mAbs = e.morning.absentees ? e.morning.absentees.length : 0;
    const eAbs = e.evening.absentees ? e.evening.absentees.length : 0;
    const m = e.morning.status==='held' ? `AM ✓ (${mAbs} absent)` : 'AM cancelled';
    const ev = e.evening.status==='held' ? `PM ✓ (${eAbs} absent)` : 'PM cancelled';
    return `<div class="log-row">
      <span><b>${fmtNice(d)}</b><br><span class="muted">${m} · ${ev}</span></span>
      <span class="btn-row">
        <button class="pill-btn btn-sm" data-edit="${d}">Edit</button>
        <button class="pill-btn btn-sm" data-del="${d}" style="color:var(--red);">Delete</button>
      </span>
    </div>`;
  }).join('');
}

document.getElementById('tab-editor').addEventListener('click', (e)=>{
  if(e.target.dataset.edit){
    startDraft(e.target.dataset.edit);
    renderEditor();
    setTimeout(()=>{ document.getElementById('entryDate').value = e.target.dataset.edit; }, 0);
    window.scrollTo({top:0, behavior:'smooth'});
  }
  if(e.target.dataset.del){
    const d = e.target.dataset.del;
    modalConfirm('Delete this entry?', `The attendance entry for ${fmtNice(d)} will be permanently deleted.`, async ()=>{
      delete log[d];
      await saveLog();
      toast('Entry deleted');
      renderEditor();
    });
  }
});

// ---------- CSV / file helpers ----------
function toCSV(rows){
  return rows.map(row => row.map(cell=>{
    const s = String(cell ?? '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(',')).join('\n');
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Download started ✅');
}

// ---------- init ----------
(async function init(){
  if (DB_URL === "PASTE_YOUR_FIREBASE_URL_HERE") {
    alert("Please edit index.html in GitHub and paste your Firebase Database URL in the DB_URL variable!");
    return;
  }
  await loadAll();
  renderBRStatus();
  renderSearch();
})();
